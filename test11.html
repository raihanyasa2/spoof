<!DOCTYPE html>
<html>
<body>

<a id="link" href="https://drive.google.com">
Right Click → Open in Split Viewwwwwww
</a>

<script>
const link = document.getElementById("link");

link.addEventListener("contextmenu", () => {

  // delay async
  setTimeout(async () => {

    try {

      const handles = await window.showOpenFilePicker();

      console.log("Picker opened", handles);

    } catch(e) {

      console.log("Blocked:", e.name);

    }

  }, 500);

});
</script>

</body>
</html>
